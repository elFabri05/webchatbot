<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soporte Internet</title>
<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --text: #1b1f24; --muted: #667085;
    --border: #e3e6ea; --accent: #0b6bcb; --accent-text: #ffffff;
    --user-bg: #0b6bcb; --user-text: #ffffff; --bot-bg: #ffffff;
    --ok: #1f7a4d; --ok-bg: #e6f4ec; --err: #b42318; --err-bg: #fdecea;
    --warn-bg: #fff4e5; --warn-text: #8a4b00; --code-bg: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --surface: #171b21; --text: #e6e8eb; --muted: #98a2b3;
      --border: #2a313a; --accent: #4a9eff; --accent-text: #0b1220;
      --user-bg: #2563b8; --user-text: #ffffff; --bot-bg: #1d232b;
      --ok: #5cc98f; --ok-bg: #12291d; --err: #ff8a80; --err-bg: #2d1514;
      --warn-bg: #2b2111; --warn-text: #f5c26b; --code-bg: #11151a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 760px; height: 100%; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  header .sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  button {
    font: inherit; font-size: 13px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 10px;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  label.toggle { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }

  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .bubble {
    padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
  .assistant .bubble { background: var(--bot-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); padding: 0 4px; }

  .banner { align-self: center; font-size: 13px; padding: 8px 12px; border-radius: 8px;
            background: var(--warn-bg); color: var(--warn-text); text-align: center; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 420px; }
  .empty p { margin: 6px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }

  .typing { align-self: flex-start; padding: 10px 14px; border-radius: 14px;
            background: var(--bot-bg); border: 1px solid var(--border); }
  .typing span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%;
                 background: var(--muted); animation: blink 1.2s infinite both; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* Debug panel */
  details.debug { width: 100%; font-size: 12px; border: 1px dashed var(--border);
                  border-radius: 8px; background: var(--surface); }
  details.debug > summary { cursor: pointer; padding: 5px 9px; color: var(--muted); user-select: none; }
  details.debug[open] > summary { border-bottom: 1px dashed var(--border); }
  .debug-body { padding: 8px 9px; display: flex; flex-direction: column; gap: 8px; }
  .call { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .call-head { display: flex; gap: 8px; align-items: center; padding: 5px 8px; background: var(--code-bg); }
  .call-head code { font-weight: 600; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 99px; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.err { background: var(--err-bg); color: var(--err); }
  .call pre { margin: 0; padding: 6px 8px; max-height: 220px; overflow: auto; background: var(--code-bg);
              border-top: 1px solid var(--border); font: 11.5px/1.4 ui-monospace, Menlo, Consolas, monospace;
              white-space: pre-wrap; overflow-wrap: anywhere; }
  .call .lbl { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
               color: var(--muted); padding: 4px 8px 0; background: var(--code-bg); }
  .usage { color: var(--muted); font-variant-numeric: tabular-nums; }
  body.no-debug details.debug { display: none; }

  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface); }
  textarea {
    flex: 1; resize: none; font: inherit; padding: 9px 12px; border-radius: 10px; min-height: 42px; max-height: 140px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .error { color: var(--err); font-size: 13px; align-self: center; }
  @media (max-width: 520px) { .msg { max-width: 92%; } header { flex-wrap: wrap; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Soporte Internet <span class="sub" id="convLabel">Asistente virtual</span></h1>
    <label class="toggle"><input type="checkbox" id="debugToggle" checked> Debug</label>
    <button id="newBtn" type="button">Nueva conversación</button>
  </header>
  <main id="log" aria-live="polite"></main>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Escribe tu mensaje…" autocomplete="off" required></textarea>
    <button class="primary" id="sendBtn" type="submit">Enviar</button>
  </form>
</div>

<script>
const $ = (s) => document.querySelector(s);
const log = $("#log"), input = $("#input"), form = $("#form"), sendBtn = $("#sendBtn");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
// ?conversation=<id> opens a specific conversation (used by the admin page).
const fromUrl = new URLSearchParams(location.search).get("conversation");
let conversationId = fromUrl || store.get("conversation_id");
let busy = false;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function scrollDown() { log.scrollTop = log.scrollHeight; }
function fmt(n) { return (n || 0).toLocaleString("es-ES"); }
function pretty(s) {
  try { return JSON.stringify(typeof s === "string" ? JSON.parse(s) : s, null, 2); }
  catch { return String(s); }
}

function renderEmpty() {
  log.replaceChildren();
  const box = el("div", "empty");
  box.append(el("p", null, "Hola 👋 Cuéntame qué le pasa a tu conexión."),
             el("p", null, "Te pediré tu teléfono o número de cuenta para revisar tu línea."));
  const chips = el("div", "chips");
  for (const t of ["No tengo internet", "Internet me va muy lento", "Se me corta la conexión"]) {
    const b = el("button", null, t); b.type = "button";
    b.onclick = () => send(t);
    chips.append(b);
  }
  box.append(chips);
  log.append(box);
}

function debugPanel(calls, usage) {
  const hasUsage = usage && Object.values(usage).some(Boolean);
  if (!(calls && calls.length) && !hasUsage) return null;
  const d = el("details", "debug");
  const errs = (calls || []).filter(c => c.is_error).length;
  const tot = usage ? (usage.input_tokens || 0) + (usage.cache_read_input_tokens || 0) + (usage.cache_creation_input_tokens || 0) : 0;
  d.append(el("summary", null,
    `Herramientas: ${(calls || []).length}${errs ? ` (${errs} con error)` : ""} · ${fmt(tot)} tokens de entrada`));
  const body = el("div", "debug-body");
  for (const c of calls || []) {
    const box = el("div", "call");
    const head = el("div", "call-head");
    head.append(el("code", null, c.name), el("span", "badge " + (c.is_error ? "err" : "ok"), c.is_error ? "error" : "ok"));
    box.append(head, el("span", "lbl", "entrada"), el("pre", null, pretty(c.input)),
               el("span", "lbl", "salida"), el("pre", null, pretty(c.output)));
    body.append(box);
  }
  if (hasUsage) {
    body.append(el("div", "usage",
      `Entrada sin caché ${fmt(usage.input_tokens)} · leída de caché ${fmt(usage.cache_read_input_tokens)} · ` +
      `escrita en caché ${fmt(usage.cache_creation_input_tokens)} · salida ${fmt(usage.output_tokens)}`));
  }
  d.append(body);
  return d;
}

function addMessage(role, text, extra = {}) {
  log.querySelector(".empty")?.remove();
  const m = el("div", "msg " + role);
  m.append(el("div", "bubble", text));
  if (role === "assistant") {
    const panel = debugPanel(extra.tool_calls, extra.usage);
    if (panel) m.append(panel);
  }
  if (extra.time) m.append(el("div", "meta", extra.time));
  log.append(m);
  scrollDown();
}

function setStatus(status) {
  log.querySelector(".banner")?.remove();
  if (status === "handoff") {
    log.append(el("div", "banner", "Conversación derivada a una persona del equipo."));
    scrollDown();
  }
}

function setConversation(id) {
  conversationId = id;
  store.set("conversation_id", id);
  $("#convLabel").textContent = id ? `Conversación ${id}` : "Asistente virtual";
}

function timeOf(iso) {
  const d = iso ? new Date(iso) : new Date();
  return d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
}

async function send(text) {
  text = (text ?? input.value).trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  log.querySelector(".error")?.remove();
  input.value = ""; autosize();
  addMessage("user", text, { time: timeOf() });
  const typing = el("div", "typing");
  typing.append(el("span"), el("span"), el("span"));
  log.append(typing); scrollDown();
  try {
    const r = await fetch("/chat", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ message: text, conversation_id: conversationId }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    setConversation(data.conversation_id);
    typing.remove();
    addMessage("assistant", data.reply, {
      tool_calls: data.tool_calls,
      usage: data.usage && {
        input_tokens: data.usage.input_tokens, output_tokens: data.usage.output_tokens,
        cache_read_input_tokens: data.usage.cache_read_input_tokens,
        cache_creation_input_tokens: data.usage.cache_creation_input_tokens,
      },
      time: timeOf(),
    });
    setStatus(data.status);
  } catch (e) {
    typing.remove();
    log.append(el("div", "error", "No se pudo enviar el mensaje. Inténtalo de nuevo."));
    console.error(e);
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
  }
}

async function restore() {
  if (!conversationId) return renderEmpty();
  try {
    const r = await fetch(`/api/conversations/${encodeURIComponent(conversationId)}`);
    if (!r.ok) throw new Error();
    const data = await r.json();
    if (!data.messages.length) { setConversation(null); return renderEmpty(); }
    log.replaceChildren();
    setConversation(data.conversation_id);
    for (const m of data.messages) {
      const u = m.usage || {};
      addMessage(m.role, m.content, {
        tool_calls: m.tool_calls, time: timeOf(m.created_at),
        usage: { input_tokens: u.input_tokens, output_tokens: u.output_tokens,
                 cache_read_input_tokens: u.cache_read_input_tokens,
                 cache_creation_input_tokens: u.cache_creation_input_tokens },
      });
    }
    setStatus(data.status);
  } catch {
    setConversation(null); renderEmpty();
  }
}

function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
form.addEventListener("submit", (e) => { e.preventDefault(); send(); });
$("#newBtn").onclick = () => {
  if (fromUrl) history.replaceState(null, "", location.pathname);
  setConversation(null); renderEmpty(); input.focus();
};

const dbg = $("#debugToggle");
dbg.checked = store.get("debug") !== "0";
document.body.classList.toggle("no-debug", !dbg.checked);
dbg.onchange = () => { document.body.classList.toggle("no-debug", !dbg.checked); store.set("debug", dbg.checked ? "1" : "0"); };

restore();
input.focus();
</script>
</body>
</html>
